typography:
  - type: french_spacing_question
    description: "Espace manquante avant le point d'interrogation."
  - type: french_spacing_exclamation
    description: "Espace manquante avant le point d'exclamation."
  - type: french_spacing_semicolon
    description: "Espace manquante avant le point-virgule."
  - type: french_spacing_colon
    description: "Espace manquante avant les deux-points."
  - type: straight_apostrophe
    description: "Apostrophe droite au lieu de l'apostrophe typographique."
  - type: straight_quotes
    description: "Guillemets anglais au lieu des guillemets français."

