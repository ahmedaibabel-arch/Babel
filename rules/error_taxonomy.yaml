    - "Rouge, immense, vivant."
    - "Un pas. Deux. L'effondrement."
    - "Elle attendait. Toujours."
    - "Impossible."
    - "Peut-être."
    - "Plus jamais."
    - "Demain."
    - "Maintenant ou jamais."
    - "Seul, enfin."
